name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A malformed settings.json silently disables *every* setting in that
      # file, with no error at startup. These are hand-edited, so parse them.
      - name: settings.json parses
        run: |
          for f in claude*/settings.json windows/settings.json codex/hooks.json agy/next-steps/*.json; do
            jq -e . "$f" > /dev/null && echo "ok    $f"
          done
          node --check next-steps.mjs && echo "ok    next-steps.mjs"

      # The autoMode block holds client context (org names, CI secret names,
      # protected branches, internal hostnames) and must never be committed.
      - name: no autoMode in tracked settings
        run: |
          fail=0
          for f in claude*/settings.json windows/settings.json; do
            if [ "$(jq 'has("autoMode")' "$f")" = "true" ]; then
              echo "FAIL  $f contains autoMode"; fail=1
            else echo "ok    $f"; fi
          done
          exit $fail

      # Paths are stored tilde-relative so a home directory never lands in a
      # public repo and the files stay portable between machines. The Codex
      # files are included because live config.toml keys [projects] and
      # [hooks.state] tables by absolute path.
      - name: no absolute home paths in tracked settings
        run: |
          if grep -l '/Users/\|/home/' claude*/settings.json windows/settings.json codex/*; then
            echo "FAIL  absolute home path in tracked settings"; exit 1
          fi
          echo "ok    all paths tilde-relative"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2154 is excluded: statusline.sh builds _rl5/_rl7 through
          # `printf -v "$1"` indirection, which shellcheck cannot follow, so it
          # reports them as referenced-but-unassigned. Verified false positives.
          shellcheck --severity=warning --exclude=SC2154 install.sh iterm-tab-status.sh wt-tab-status.sh prisma-prod-guard.sh wt-dev.sh update-plugins.sh claude-handoff.sh \
            statusline.sh claude/statusline-command.sh claude*/statusline.sh .claude/skills/review-loop/pr-bots.sh \
            statusline-tests/run.sh

      # shellcheck above only proves statusline.sh parses and avoids known
      # footguns. It cannot see that the rendered line is wrong, and the %b
      # escape bug (#81) was shellcheck-clean for as long as it existed. These
      # tests build fixture repos and assert on what the script actually prints.
      # The warm-render guard compares against a baseline timed in the same run
      # (see statusline-tests/README.md), so it needs no runner-specific budget.
      - name: statusline behaviour tests
        run: ./statusline-tests/run.sh

      # statusline.sh prints its two lines with `printf '%s'`, so ACCOUNT_COLOR
      # must already hold a real ESC byte: only $'\033[..m' does that. A
      # plain-single-quoted '\033[..m' renders as the visible text
      # "\033[36mPERSONAL". The template and the three copies are covered by the
      # drift check below, but the README documents this assignment twice and
      # nothing tied those to the code, so both went stale in #82.
      - name: ACCOUNT_COLOR literals are ANSI-C quoted
        run: |
          # Scoped to ACCOUNT_COLOR lines: the README also quotes the broken
          # form in prose, to say what it renders as.
          #
          # \\+ matches one OR MORE backslashes. The README's gen() helper
          # passes the line inside a double-quoted shell string, where the same
          # mistake reads '\\033[36m' with two of them, and a one-backslash
          # pattern walked straight past it.
          if grep -nP "ACCOUNT_COLOR.*(?<!\\\$)'\\\\+033\[" README.md statusline.sh claude*/statusline.sh; then
            echo "FAIL  the lines above use '\\033[..m'; it must be \$'\\033[..m'"
            exit 1
          fi
          echo "ok    every ACCOUNT_COLOR literal is ANSI-C quoted"

      # The account status lines are generated from statusline.sh and differ
      # only in the config block on lines 14-15. Hand-editing one copy is the
      # documented way they drift apart, so diff them ignoring it.
      - name: account status lines match the template
        run: |
          fail=0
          for a in claude-personal claude-work claude-dev claude-yosh; do
            if diff <(sed '14,15d' statusline.sh) <(sed '14,15d' "$a/statusline.sh") > /dev/null; then
              echo "ok    $a/statusline.sh"
            else
              echo "FAIL  $a/statusline.sh has drifted from statusline.sh"; fail=1
            fi
          done
          exit $fail

      - name: install.sh --help works
        run: ./install.sh --help

  # The Mac runs these scripts with the stock /bin/bash 3.2 and BSD awk, sed and
  # cp, which the Ubuntu job never exercises. A newline in `awk -v` passed there
  # and broke both --check and deploy on macOS (#31).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: scripts parse under bash 3.2
        run: |
          fail=0
          for f in install.sh iterm-tab-status.sh wt-tab-status.sh prisma-prod-guard.sh wt-dev.sh update-plugins.sh claude-handoff.sh \
            statusline.sh claude/statusline-command.sh claude*/statusline.sh .claude/skills/review-loop/pr-bots.sh \
            statusline-tests/run.sh; do
            if /bin/bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; fail=1; fi
          done
          exit $fail

      # Run the status line tests under the stock bash 3.2 and BSD sed as well.
      # This is the only job that proves the script renders correctly there
      # rather than merely parsing: the Ubuntu job runs bash 5.
      - name: statusline behaviour tests under bash 3.2
        run: /bin/bash ./statusline-tests/run.sh

      # Deploy into a scratch HOME (with ~/.codex and agy's directory, so the
      # hook trust is seeded and the agy plugin and status line are set too),
      # then --check must find no drift. awk reports errors without failing the
      # script, so anything on stderr fails the step as well. The runner has no
      # claude CLI, so the plugin check skips itself instead of flagging every
      # enabled plugin as not installed in the empty HOME. config.toml is
      # restored by hand (README "Codex config") rather than deployed, so do
      # that first; the deploy then appends the hook trust tables to it.
      - name: install.sh deploys and checks clean with BSD tools
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.codex" "$HOME/.gemini/antigravity-cli"
          cp codex/config.toml "$HOME/.codex/config.toml"
          awk --version
          err="$RUNNER_TEMP/stderr.txt"
          fail=0
          /bin/bash ./install.sh 2> "$err" || fail=1
          /bin/bash ./install.sh --check 2>> "$err" || fail=1
          if [ -s "$err" ]; then
            echo "FAIL  install.sh wrote to stderr:"; cat "$err"; fail=1
          fi
          if [ "$fail" = 0 ]; then echo "ok    deploy and --check, nothing on stderr"; fi
          exit $fail
