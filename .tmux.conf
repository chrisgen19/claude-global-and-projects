# tmux settings, copied by hand to ~/.tmux.conf (README, "tmux config").
# Reload a running tmux with: tmux source-file ~/.tmux.conf

# Mouse: the wheel scrolls tmux's history (copy mode) instead of the terminal
# turning it into Up/Down keys, which CLIs read as prompt history. Hold Shift to
# select text with the terminal itself.
set -g mouse on
# Lines kept per pane for scrolling back; applies to panes created after a reload.
set -g history-limit 50000

# next-steps: alt+n opens the suggestion menu in a popup and pastes the pick into
# the pane. Needs next-steps with its popup command (README, "herdr and tmux popups").
bind-key -n M-n display-popup -E -w 90% -h 15 'next-steps popup tmux'
