# ~/.codex/config.toml - Codex CLI global config
#
# Machine-specific [projects."<path>"] trust_level entries are intentionally
# omitted; Codex writes those itself the first time you trust a directory.

model = "gpt-6.1-sol"
personality = "pragmatic"
model_reasoning_effort = "medium"

# Keep the sandbox enabled and route eligible approvals to Auto-review.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# Enable the Codex hooks system that ~/.codex/hooks.json drives.
[features]
hooks = true

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

# Status line segments, rendered left to right in the TUI.
[tui]
status_line = [
  "model-with-reasoning",
  "fast-mode",
  "codex-version",
  "current-dir",
  "git-branch",
  "branch-changes",
  "pull-request-number",
  "context-used",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "estimated-thread-cost",
]
fullscreen_transcript = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 3

[mcp_servers.atlassian-rovo]
url = "https://mcp.atlassian.com/v1/mcp/authv2"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# Needs the shadcn CLI on PATH: `npm i -g shadcn` (under nvm it is per Node version).
[mcp_servers.shadcn]
command = "shadcn"
args = ["mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--headless"]

# The token itself lives in $BUDGET_MCP_TOKEN, never in this file.
[mcp_servers.budget]
url = "https://budget.cgdev.site/api/mcp"
bearer_token_env_var = "BUDGET_MCP_TOKEN"

[plugins."superpowers@openai-curated"]
enabled = true
